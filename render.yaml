services:
  - type: web
    runtime: python
    name: finance-dashboard-api
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python data/bootstrap_database.py && uvicorn src.backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_MODE
        value: "true"

  - type: web
    runtime: static
    name: finance-dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
